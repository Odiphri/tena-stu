<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tena-student-community</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <div class="welcome-section">
        <h1>Welcome to Tena Student Community</h1>
        <p>Connect, share, and grow with fellow students!</p>
    </div>
    <div class="auth-section">
        <div class="auth-toggle-btn">
            <button class="login-btn-a">Login</button>
            <button class="register-btn-a">Register</button>
        </div>
        <form class="login-form" action="login" method="post">
            <label for="username">Email:</label>
            <input type="email" id="username" name="username" placeholder="e.g john@example.com" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="*******" required>
            <br>
            <input class="login-btn" type="submit" value="Login">
        </form>
    </div>
</body>
</html>
