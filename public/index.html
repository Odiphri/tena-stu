<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tena-student-community</title>
    <link rel="stylesheet" href="../css/index.css">
    <script src="../js/index.js" defer></script>
</head>
<body>
    <div class="welcome-section">
        <h1>Welcome to Tena Student Community</h1>
        <p>Connect, share, and grow with fellow students!</p>
    </div>
    <div class="auth-section">
        <div class="auth-toggle-btn">
            <p class="btn-a active" id="login-tab" onclick="showLogin()">Login</p>
            <p class="btn-a" id="register-tab" onclick="showSignup()">Register</p>
        </div>
        <form class="login-form" id="login-form" action="login" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="e.g john@example.com" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <br>
            <input class="login-btn" type="submit" value="Login" disabled>
        </form>
        <form class="register-form" id="register-form" action="register" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="e.g john@example.com" required>
            <br>
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full-name" placeholder="e.g John Doe" required>
            <br>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="e.g johndoe123" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <br>
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>
            <br>
            <input class="login-btn" type="submit" value="Register" disabled>
        </form>
    </div>
</body>
</html>
